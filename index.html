<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("nokta-theme");
        } catch {}
        document.documentElement.dataset.theme = theme === "light" || theme === "dark"
          ? theme
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <link rel="icon" href="/nokta-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/nokta-favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/nokta-favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/nokta-favicon-180.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The venue list and first photo load from Supabase on the opening view. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- Fonts can swap in after first paint; the fallback stack remains readable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Outfit:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Outfit:wght@400;500;600;700&display=swap" /></noscript>

    <title>nokta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
