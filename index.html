<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/nokta-favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/nokta-favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/nokta-favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/nokta-favicon-180.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Fonts load from the HTML, not via @import in the bundled CSS. An @import is
      only discovered after that stylesheet has been fetched and parsed, which put
      Google Fonts at the end of a four-request critical chain. Declared here they
      are found in the initial HTML and fetched in parallel with the CSS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Outfit:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700&family=Outfit:wght@400;500;600;700&display=swap" />

    <title>nokta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
