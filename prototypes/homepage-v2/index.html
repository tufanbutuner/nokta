<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nokta — homepage v2, lo-fi</title>
<link rel="stylesheet" href="lofi.css" />
<style>
  body { background: var(--page); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 36px 24px 60px; }
  .wrap > .h1 { font-size: 34px; }
  .lede { margin-top: 8px; max-width: 62ch; color: var(--ink-2); }
  .grid { margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 34px 26px; }
  figure { display: grid; gap: 14px; justify-items: center; }
  .phone { width: 330px; height: 714px; border-radius: 40px; padding: 10px; background: var(--ink); box-shadow: 0 30px 50px -30px oklch(0.2 0.02 40 / 0.6); }
  .phone iframe { width: 390px; height: 874px; border: 0; border-radius: 31px; transform: scale(0.794); transform-origin: 0 0; background: var(--paper); }
  .phone > div { width: 310px; height: 694px; overflow: hidden; border-radius: 31px; }
  figcaption { width: 330px; }
  figcaption b { display: block; font-size: 16px; font-weight: 600; }
  figcaption p { margin-top: 4px; font-size: 13.5px; color: var(--ink-2); }
  figcaption a { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 600; border-bottom: 1px solid currentColor; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="h1">Homepage, three ways</h1>
  <p class="lede">Lo-fi, mobile first, on the existing nokta palette. Each answers the same visitor (a group night out, somewhere nearby now, or an occasion) with a different first move. Venue names and prices are sample data.</p>
  <div class="grid">
    <figure>
      <div class="phone"><div><iframe src="a-the-plan.html" title="A · What's the plan?"></iframe></div></div>
      <figcaption><b>A · What's the plan?</b><p>Lead with the occasion. Tonight, Birthday and Big group each reshape what you see: closing times, private areas, minimum spend.</p><a href="a-the-plan.html">Open full screen</a></figcaption>
    </figure>
    <figure>
      <div class="phone"><div><iframe src="b-dot-map.html" title="B · The dot map"></iframe></div></div>
      <figcaption><b>B · The dot map</b><p>Venues as literal dots on a quiet street sketch, with no map tiles. Built for "somewhere near me, right now". Price and closing time on tap.</p><a href="b-dot-map.html">Open full screen</a></figcaption>
    </figure>
    <figure>
      <div class="phone"><div><iframe src="c-pick-three.html" title="C · Sort the group chat"></iframe></div></div>
      <figcaption><b>C · Sort the group chat</b><p>One person choosing for friends. Edit a sentence, shortlist up to three (the dots fill), send one link the group votes on.</p><a href="c-pick-three.html">Open full screen</a></figcaption>
    </figure>
  </div>
</div>
</body>
</html>
