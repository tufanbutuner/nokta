[functions.create-checkout-session]
verify_jwt = true

[functions.create-billing-portal-session]
verify_jwt = true

[functions.refresh-owner-subscription]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.send-notification-email]
# Signed-out visitors submit bookings and enquiries, so this cannot require a
# Supabase JWT. It authenticates its caller with NOTIFICATION_DISPATCH_SECRET
# instead, and is reachable only through the /api/send-notification-email proxy.
verify_jwt = false
